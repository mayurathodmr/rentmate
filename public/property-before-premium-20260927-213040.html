<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Property Details — RentMate</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:"DM Sans",sans-serif;
  background:#f5f7fb;
  color:#182033;
}
a{text-decoration:none;color:inherit}

.nav{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid #e8ebf2;
  position:sticky;
  top:0;
  z-index:20;
}
.logo{
  font-family:"Plus Jakarta Sans";
  font-size:24px;
  font-weight:800;
}
.logo span{color:#635bff}

.back{
  padding:10px 16px;
  border:1px solid #e1e4ec;
  border-radius:12px;
  background:white;
  cursor:pointer;
}

.container{
  width:min(1180px,92%);
  margin:30px auto 70px;
}

.status{
  padding:18px;
  background:white;
  border-radius:18px;
  border:1px solid #e7eaf0;
  text-align:center;
}

.gallery{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
  margin-bottom:24px;
}
.gallery img{
  width:100%;
  height:390px;
  object-fit:cover;
  border-radius:20px;
  background:#e8ebf2;
}
.side{
  display:grid;
  gap:12px;
}
.side img{height:189px}

.layout{
  display:grid;
  grid-template-columns:1.5fr .7fr;
  gap:24px;
}

.card{
  background:white;
  border:1px solid #e7eaf0;
  border-radius:22px;
  padding:25px;
  margin-bottom:20px;
  box-shadow:0 10px 35px rgba(25,35,60,.05);
}

.title{
  font-family:"Plus Jakarta Sans";
  font-size:30px;
  font-weight:800;
  margin-bottom:8px;
}
.location{
  color:#687086;
  margin-bottom:22px;
}

.price{
  font-family:"Plus Jakarta Sans";
  font-size:30px;
  font-weight:800;
}
.price small{
  font-size:14px;
  color:#7a8192;
  font-weight:500;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.feature{
  padding:15px;
  background:#f7f8fc;
  border-radius:14px;
}
.feature b{
  display:block;
  margin-bottom:5px;
}
.feature span{color:#737b8e;font-size:13px}

.amenities{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.amenity{
  background:#f1f3ff;
  color:#5149d9;
  padding:9px 13px;
  border-radius:30px;
  font-size:13px;
}

.owner{
  display:flex;
  align-items:center;
  gap:14px;
}
.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  background:#635bff;
  color:white;
  display:grid;
  place-items:center;
  font-weight:700;
}
.owner small{
  display:block;
  color:#7a8192;
  margin-top:3px;
}

.sticky{
  position:sticky;
  top:95px;
}

.enquiry input,
.enquiry textarea{
  width:100%;
  border:1px solid #dfe3eb;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
  font:inherit;
}
.enquiry textarea{
  min-height:100px;
  resize:vertical;
}
.btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#635bff;
  color:white;
  font-weight:700;
  cursor:pointer;
}
.btn:hover{background:#5149e8}

.message{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  display:none;
  font-size:14px;
}

@media(max-width:800px){
  .gallery{grid-template-columns:1fr}
  .gallery>img{height:260px}
  .side{
    grid-template-columns:1fr 1fr;
  }
  .side img{height:130px}
  .layout{grid-template-columns:1fr}
  .sticky{position:static}
  .grid{grid-template-columns:1fr 1fr}
  .title{font-size:24px}
}

@media(max-width:480px){
  .grid{grid-template-columns:1fr}
  .nav{padding:0 4%}
}
</style>
<link rel="stylesheet" href="/css/rentmate-premium.css">
<link rel="stylesheet" href="/css/rentmate-guidance.css">
<link rel="stylesheet" href="/css/rentmate-student.css">
<link rel="stylesheet" href="/css/rentmate-app.css">
<link rel="stylesheet" href="/css/rentmate-final.css">
</head>

<body>

<nav class="nav">
  <a href="/" class="logo">Rent<span>Mate</span></a>
  <button class="back" onclick="history.back()">← Back</button>
</nav>

<main class="container">

  <div id="loading" class="status">
    Loading real property details...
  </div>

  <div id="error" class="status" style="display:none"></div>

  <section id="content" style="display:none">

    <div class="gallery" id="gallery"></div>

    <div class="layout">

      <div>

        <div class="card">
          <div class="title" id="title"></div>
          <div class="location" id="location"></div>

          <div class="price">
            ₹<span id="rent"></span>
            <small>/ month</small>
          </div>
        </div>

        <div class="card">
          <h2>Property Details</h2>
          <br>

          <div class="grid">
            <div class="feature">
              <b id="propertyType">—</b>
              <span>Property Type</span>
            </div>

            <div class="feature">
              <b id="bhk">—</b>
              <span>BHK</span>
            </div>

            <div class="feature">
              <b id="furnishing">—</b>
              <span>Furnishing</span>
            </div>

            <div class="feature">
              <b id="area">—</b>
              <span>Area</span>
            </div>

            <div class="feature">
              <b id="deposit">—</b>
              <span>Security Deposit</span>
            </div>

            <div class="feature">
              <b id="available">—</b>
              <span>Availability</span>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>Description</h2>
          <br>
          <p id="description" style="line-height:1.8;color:#626a7d"></p>
        </div>

        <div class="card">
          <h2>Amenities</h2>
          <br>
          <div class="amenities" id="amenities"></div>
        </div>

        <div class="card">
          <h2>Owner</h2>
          <br>
          <div class="owner">
            <div class="avatar" id="avatar">O</div>
            <div>
              <b id="ownerName">Property Owner</b>
              <small>Listed on RentMate</small>
            </div>
          </div>
        </div>

      </div>

      <aside class="sticky">

        <div class="card enquiry">
          <h2>Contact Owner</h2>
          <p style="color:#737b8e;margin:8px 0 18px">
            Send a genuine enquiry about this property.
          </p>

          <input id="name" placeholder="Your name">
          <input id="phone" placeholder="Phone number">
          <textarea id="message" placeholder="I'm interested in this property..."></textarea>

          <button class="btn" onclick="sendEnquiry()">
            Send Enquiry
          </button>

          <div id="result" class="message"></div>
        </div>

      </aside>

    </div>
  </section>
</main>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

const $ = id => document.getElementById(id);

function money(value){
  const n = Number(value);
  return Number.isFinite(n)
    ? n.toLocaleString("en-IN")
    : "—";
}

function text(value, fallback="—"){
  return value === undefined ||
         value === null ||
         value === ""
    ? fallback
    : value;
}

async function loadProperty(){

  if(!id){
    showError("Property ID is missing.");
    return;
  }

  try{

    const res = await fetch("/api/properties/" + encodeURIComponent(id));
    const data = await res.json();

    if(!res.ok || !data.success){
      throw new Error(data.error || "Property not found");
    }

    const p = data.property || data.data;

    if(!p){
      throw new Error("Property data unavailable");
    }

    render(p);

  }catch(err){

    console.error(err);

    showError(
      "Unable to load this property. " +
      "The listing may have been removed or is currently unavailable."
    );
  }
}

function render(p){

  $("loading").style.display="none";
  $("content").style.display="block";

  $("title").textContent =
    text(p.title, "Rental Property");

  const locationParts = [
    p.area,
    p.locality,
    p.city,
    p.state
  ].filter(Boolean);

  $("location").textContent =
    locationParts.length
      ? locationParts.join(", ")
      : "Location not provided";

  $("rent").textContent = money(p.rent);

  $("propertyType").textContent =
    text(p.property_type || p.type);

  $("bhk").textContent =
    text(p.bhk);

  $("furnishing").textContent =
    text(p.furnishing);

  $("area").textContent =
    p.area_sqft
      ? money(p.area_sqft) + " sq ft"
      : "—";

  $("deposit").textContent =
    p.deposit
      ? "₹" + money(p.deposit)
      : "Not specified";

  $("available").textContent =
    text(p.available_from || p.availability);

  $("description").textContent =
    text(
      p.description,
      "No description provided by the owner."
    );

  const owner =
    p.owner ||
    p.owner_name ||
    "Property Owner";

  $("ownerName").textContent = owner;

  $("avatar").textContent =
    String(owner).charAt(0).toUpperCase();

  const amenities =
    Array.isArray(p.amenities)
      ? p.amenities
      : [];

  $("amenities").innerHTML =
    amenities.length
      ? amenities.map(a =>
          `<span class="amenity">${escapeHtml(a)}</span>`
        ).join("")
      : `<span style="color:#777">No amenities specified</span>`;

  renderGallery(p.images || []);
}

function renderGallery(images){

  const gallery = $("gallery");

  if(!Array.isArray(images) || !images.length){
    gallery.innerHTML = `
      <div style="
        height:390px;
        border-radius:20px;
        background:#e9ecf3;
        display:grid;
        place-items:center;
        color:#777;
      ">
        No property photos uploaded
      </div>
    `;
    return;
  }

  const safe = images
    .filter(Boolean)
    .slice(0,3);

  gallery.innerHTML = `
    <img
      src="${escapeAttr(safe[0])}"
      alt="Property photo"
      onerror="this.style.display='none'"
    >

    <div class="side">
      ${safe.slice(1).map(img => `
        <img
          src="${escapeAttr(img)}"
          alt="Property photo"
          onerror="this.style.display='none'"
        >
      `).join("")}
    </div>
  `;
}

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function escapeAttr(value){
  return escapeHtml(value);
}

function showError(message){

  $("loading").style.display="none";
  $("error").style.display="block";
  $("error").textContent=message;
}

async function sendEnquiry(){

  const name = $("name").value.trim();
  const phone = $("phone").value.trim();
  const message = $("message").value.trim();
  const result = $("result");

  if(!name || !phone){

    result.style.display="block";
    result.textContent="Please enter your name and phone number.";
    return;
  }

  result.style.display="block";
  result.textContent="Sending enquiry...";

  try{

    const token =
      localStorage.getItem("rentmate_token");

    const res = await fetch("/api/enquiries",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        ...(token
          ? {"Authorization":"Bearer "+token}
          : {})
      },
      body:JSON.stringify({
        property_id:id,
        name,
        phone,
        message
      })
    });

    const data = await res.json();

    if(!res.ok || !data.success){
      throw new Error(
        data.error || "Unable to send enquiry"
      );
    }

    result.textContent =
      "✓ Enquiry sent successfully.";

    $("message").value="";

  }catch(err){

    console.error(err);

    result.textContent =
      err.message ||
      "Unable to send enquiry right now.";
  }
}

loadProperty();

</script>

<script src="/js/rentmate-premium.js" defer></script>
<script src="/js/rentmate-guidance.js" defer></script>
<script src="/js/rentmate-location-direct.js" defer></script>
<script src="/js/rentmate-student.js" defer></script>
<script src="/js/rentmate-app.js" defer></script>
<script src="/js/rentmate-final.js"></script>
<script src="/js/rentmate-real-system.js"></script>
<script id="rentmate-sw-register">
if("serviceWorker" in navigator){
 navigator.serviceWorker.register("/sw.js").catch(()=>{});
}
</script>
</body>
</html>
